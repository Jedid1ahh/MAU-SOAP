{% extends "base.html" %}

{% block title %}MAU-SOAP | Secure Online Assessment{% endblock %}

{% block content %}
  <section class="card">
    <span class="status-badge">Secure online assessment</span>
    <h1>MAU-SOAP</h1>
    <p>
      Sign in once and MAU-SOAP will open the dashboard for your account role.
    </p>
    <div class="portal-actions">
      <a class="primary-button button-auto" href="{{ url_for('accounts.login') }}">
        Login
      </a>
      <a class="secondary-button" href="{{ url_for('accounts.register_student') }}">
        Student registration
      </a>
      <a class="secondary-button" href="{{ url_for('accounts.register_lecturer') }}">
        Lecturer registration
      </a>
    </div>
  </section>
{% endblock %}

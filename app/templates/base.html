<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MAU-SOAP{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('main.index') }}">MAU-SOAP</a>
      <nav aria-label="Primary navigation">
        {% if current_user.is_authenticated %}
          <a href="{{ url_for('admin.index') }}">Dashboard</a>
          <form action="{{ url_for('admin.logout') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="link-button" type="submit">Log out</button>
          </form>
        {% else %}
          <a href="{{ url_for('admin.login') }}">Admin login</a>
        {% endif %}
      </nav>
    </header>

    <main class="page-shell">
      <section class="flash-stack" aria-live="polite">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
      </section>

      {% block content %}{% endblock %}
    </main>
  </body>
</html>

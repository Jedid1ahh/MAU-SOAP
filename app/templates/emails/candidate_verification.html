<!doctype html>
<html lang="en">
  <body>
    <p>Hello {{ verification.candidate_name }},</p>

    <p>
      Your verification code for
      <strong>{{ verification.exam.title }}</strong>
      is:
    </p>

    <p
      style="
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.25rem;
      "
    >
      {{ otp }}
    </p>

    <p>
      <a href="{{ magic_url }}">
        Verify and continue securely
      </a>
    </p>

    <p>
      This verification request expires shortly.
      If you did not request it, ignore this email.
    </p>
  </body>
</html>
